<!DOCTYPE html>

<title>容兒 · 個人品牌</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
<style>
* {margin:0;padding:0;box-sizing:border-box}
body {font-family:"Noto Sans TC",sans-serif;background:#faf7f5;color:#333;line-height:1.7}
nav {position:fixed;top:0;width:100%;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);padding:15px 0;z-index:100;text-align:center;box-shadow:0 1px 10px rgba(0,0,0,.05)}
nav a {margin:0 20px;color:#555;text-decoration:none;font-size:15px}
.hero {height:100vh;background:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.45)),url(https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=1200) center/cover;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff}
.hero h1 {font-size:4rem;font-weight:300;letter-spacing:8px}
.hero p {font-size:1.2rem;margin-top:15px;opacity:.9}
.section {padding:80px 20px;max-width:1000px;margin:0 auto}
.section h2 {text-align:center;font-size:2rem;font-weight:400;margin-bottom:40px;color:#8b6f5c}
.about {text-align:center;font-size:1.1rem;max-width:700px;margin:0 auto}
.gallery {display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.gallery img {width:100%;height:320px;object-fit:cover;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,.08)}
.contact {text-align:center}
.btn {display:inline-block;margin:10px;padding:12px 30px;background:#8b6f5c;color:#fff;text-decoration:none;border-radius:30px;font-size:15px}
.btn:hover {background:#6d5648}
footer {text-align:center;padding:40px;color:#999;font-size:14px}
</style>
</head>
<body>
<nav>
<a href="#about">關於我</a>
<a href="#gallery">作品</a>
<a href="#contact">聯絡</a>
</nav>

</section>
